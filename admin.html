<script>/* themes v2 (2026-11-13): the theme picked in the courses (course.js, localStorage js1-theme), set before first paint and
   resolved the same way (nothing saved / "auto" = by time of day, "study" = its study theme, "" = system, else the named theme) */
(function(){var N=" light dark midnight nord dracula forest sunset ocean sepia focus monk paper matcha amber cafe dawn momentum ",S={sunset:"dawn",light:"paper",dark:"focus",midnight:"amber"};
  function pick(){var t=null;try{t=localStorage.getItem("js1-theme");}catch(e){}
    if(t===null||t==="auto"||t==="study"){var h=new Date().getHours(),a=h>=5&&h<9?"sunset":h>=9&&h<17?"light":h>=17&&h<21?"dark":"midnight";return t==="study"?S[a]:a;}
    return t&&N.indexOf(" "+t+" ")>=0?t:"";}
  function set(){var a=pick(),r=document.documentElement;if(r.getAttribute("data-theme")===(a||null))return;if(a)r.setAttribute("data-theme",a);else r.removeAttribute("data-theme");}
  set();addEventListener("storage",function(e){if(!e.key||e.key==="js1-theme")set();});setInterval(set,60000);})();</script>

  /* P7 (2026-11-19, kb/lock/access-lock.md §19): content health. healthRank(inp) is PURE (tested in scripts/unit-checks/admin-health.test.mjs).
     inp = {now:ms, lessons:[{c,k,t,f}] (from PLAN_OUTLINE), votes:[{course,lesson,section,title,clear,confusing}],
       learners:[{idle:days, ql:{"c|k":[correct,answered]}, last:{c,k}|null, time:{"c|k":seconds}, misses:{"q:<k>:<i>":text|null}, loop:["c|k"]}],
       errors:[{page,msg,created_at}], tutor:[{course,lesson,n}], fixed:{"c:k":iso}}.

      var o=votes[id]=votes[id]||{c:0,n:0};o.c+=c;o.n+=c+k;if(c>0)r.sections.push({s:String(v.section||""),t:String(v.title||v.section||""),c:c,n:c+k});});

        var o=q[id]=q[id]||{c:0,a:0,u:0};o.c+=+a[0]||0;o.a+=+a[1]||0;if((+a[1]||0)>0)o.u++;var oc=cq[p]=cq[p]||{c:0,a:0};oc.c+=+a[0]||0;oc.a+=+a[1]||0;}
      if(x.last&&x.idle>=7){var d=x.last.c+":"+x.last.k;drop[d]=(drop[d]||0)+1;}
      for(var tk in (x.time||{})){if((+x.time[tk]||0)>=10&&(+x.time[tk]||0)<120){var s=tk.replace("|",":");shortR[s]=(shortR[s]||0)+1;}}
      for(var mi in (x.misses||{})){var m=/^q:([^:]+):(\d+)$/.exec(mi);if(!m)continue;var lid=null;
        for(var i=0;i<ids.length;i++){if(L[ids[i]].k===m[1]){lid=ids[i];break;}}
        if(!lid)continue;var mo=miss[lid]=miss[lid]||{n:0,u:0,by:{}};mo.n++;if(!ml[lid]){ml[lid]=1;mo.u++;}mo.by[+m[2]+1]=(mo.by[+m[2]+1]||0)+1;}

    (inp.tutor||[]).forEach(function(t){var id=t.course+":"+t.lesson;tut[id]=(tut[id]||0)+(+t.n||0);});
    var err={};(inp.errors||[]).forEach(function(e){if(!e)return;var ts=new Date(e.created_at).getTime();if(!(now-ts<=14*864e5))return;
      var pg=String(e.page||"").split(/[#?]/)[0],id=null;for(var f in byFile){if(pg.length>=f.length&&pg.slice(-f.length)===f){id=byFile[f];break;}}

      var v=votes[id];if(v&&v.n>=3){get().parts.conf=W.conf*cl(v.c/v.n,1);get().n.conf=v.n;get().ev.conf=v.c+" of "+v.n+" votes confusing";any=true;}
      var a=q[id],ca=cq[L[id].c];if(a&&a.a>=10&&a.u>=2&&ca&&ca.a>0){var gap=cl(ca.c/ca.a-a.c/a.a,1);if(gap>0){get().parts.quiz=W.quiz*cl(gap/0.4,1);get().n.quiz=a.a;get().ev.quiz=Math.round(100*a.c/a.a)+"% right on "+a.a+" answers (course "+Math.round(100*ca.c/ca.a)+"%)";any=true;}}
      if(drop[id]>=2){get().parts.drop=W.drop*cl(drop[id]/5,1);get().n.drop=drop[id];get().ev.drop=drop[id]+" learners idle 7+ days stopped here";any=true;}
      var mo=miss[id];if(mo&&mo.n>=3&&mo.u>=2){var top=0,tn=0;for(var qn in mo.by){if(mo.by[qn]>top){top=mo.by[qn];tn=qn;}}

        for(var qk in mo.by)get().questions.push({q:+qk,n:mo.by[qk]});get().questions.sort(function(x,y){return y.n-x.n;});}
      if(shortR[id]>=3){get().parts.short=W.short*cl(shortR[id]/6,1);get().n.short=shortR[id];get().ev.short=shortR[id]+" learners opened it for under 2 min";any=true;}

      if(tut[id]>=2){get().parts.tut=W.tut*cl(tut[id]/6,1);get().n.tut=tut[id];get().ev.tut=tut[id]+" tutor questions";any=true;}

    if(!v||v.length>40){toast("Write 1 to 40 characters, e.g. 24 hours or 2 working days.");return;}
    if(await call("set_approval_eta",{p_text:v})){await load();toast("Saved: learners now read “usually approved within "+v+"”.");}});

  /* the photo is shrunk to 640px wide in the browser before it is sent */
  function shrink(file){return new Promise(function(ok,no){var img=new Image();img.onload=function(){
      var w=Math.min(640,img.naturalWidth),h=Math.round(w*img.naturalHeight/img.naturalWidth),c=document.createElement("canvas");
      c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(img.src);ok(c.toDataURL("image/jpeg",.9));};
    img.onerror=function(){no(new Error("That file is not a picture."));};img.src=URL.createObjectURL(file);});}
  async function invite(e){e.preventDefault();var m=document.getElementById("ivMsg"),f=document.getElementById("ivPhoto").files[0];
    var btn=e.target.querySelector("button");btn.disabled=true;m.className="au-msg";m.textContent="Reading the face… (can take up to a minute if the face server was asleep)";
    try{var image=await shrink(f);}catch(x){m.className="au-msg err";m.textContent=x.message;btn.disabled=false;return;}
    var r=await AUTH.fn("invite",{name:document.getElementById("ivName").value,email:document.getElementById("ivMail").value,image:image});
    if(!r.ok){m.className="au-msg err";m.textContent=r.error||"Failed.";btn.disabled=false;return;}
    await load();var m2=document.getElementById("ivMsg");m2.className="au-msg good";m2.textContent="Pre-approved. When they register at login.html#register with this email and their selfie matches, they are in.";}

  (async function(){
    if(!AUTH.on){card("The course lock is not set up yet (assets/js/auth-config.js).");return;}
    ME=await AUTH.me();
    if(ME&&!ME.face){await AUTH.signOut(true);ME=null;}
    if(!ME){card("Log in first (with your face).",'<a class="au-btn pri" href="login.html?next=admin.html">Log in</a>');return;}
    document.getElementById("who").textContent=ME.profile.email+" · "+ME.profile.role;
    var o=document.getElementById("out");o.hidden=false;o.onclick=async function(){await AUTH.signOut();location.href="index.html";};
    if(!ME.admin){card("This page is for the owner and admins only.",'<a class="au-btn" href="index.html">All courses</a>');return;}
    load();
  })();
})();
</script>

<!-- ===== AI tutor: most-asked questions (2026-11-18, kb/lock/access-lock.md → §15) =====
     Self-contained block (nothing above calls it): after every render of #app it adds its own panel at the end and reads
     public.tutor_questions (question text + course + lesson + time only; admins read by RLS). A missing table, a learner or
     the lock being off → no panel. Everything shown is escaped.
     v2: a per-course filter (the choice is kept while the page is open) and retention: once per page load it calls rpc
     tutor_questions_prune() (deletes rows older than 180 days; a missing function or an error changes nothing here).
     v3 (2026-11-19): the numbers come from rpc tutor_questions_stats(p_course) over the WHOLE table (a course pick asks again);
     while that function does not exist (SQL not re-run) it falls back to reading the newest 1,000 rows and counting here. -->
<script>
(function(){
  var app=document.getElementById("app");
  if(!app||!window.AUTH||!AUTH.sb||!window.MutationObserver)return;
  var esc=AUTH.esc,CN=AUTH.COURSES||{},M=null,busy=false,MAXR=1000,pickC="",pruned=false,rows=null,srv=null;
  function ago(t){var m=Math.max(0,Math.round((Date.now()-new Date(t))/6e4));return m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago";}
  function where(r){return esc((CN[r.course]||r.course)+" · "+String(r.lesson).toUpperCase());}
  function top(map,n){return Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return b.n-a.n||new Date(b.t)-new Date(a.t);}).slice(0,n);}
  var ok=function(r){return r&&typeof r.q==="string"&&typeof r.course==="string"&&typeof r.lesson==="string";};
  /* the model both sources produce: {all, total, week, courses {c: n}, lessons [{course, lesson, n, t}], repeats [{q, course, lesson, n, t}],
     recent [{created_at, course, lesson, q}], whole (true = counted over the whole table on the server)} */
  function local(){var byC={};rows.forEach(function(r){byC[r.course]=(byC[r.course]||0)+1;});
    var view=pickC?rows.filter(function(r){return r.course===pickC;}):rows,byL={},byQ={},wk=Date.now()-7*864e5,week=0;
    view.forEach(function(r){var lk=r.course+"|"+r.lesson,qk=lk+"|"+String(r.q).toLowerCase().replace(/[^a-z0-9\[\] ]+/g," ").replace(/\s+/g," ").trim();
      if(new Date(r.created_at)>=wk)week++;
      (byL[lk]=byL[lk]||{course:r.course,lesson:r.lesson,n:0,t:r.created_at}).n++;(byQ[qk]=byQ[qk]||{q:r.q,course:r.course,lesson:r.lesson,n:0,t:r.created_at}).n++;});
    return {all:rows.length,total:view.length,week:week,courses:byC,lessons:top(byL,12),repeats:top(byQ,12).filter(function(x){return x.n>1;}),recent:view.slice(0,25),whole:false};}
  function fromSrv(v){var A=function(x){return Array.isArray(x)?x:[];},N=function(x){x=+x;return isFinite(x)&&x>=0?x:0;};
    var cs={};if(v.courses&&typeof v.courses==="object")Object.keys(v.courses).forEach(function(k){cs[k]=N(v.courses[k]);});
    return {all:N(v.all),total:N(v.total),week:N(v.week),courses:cs,lessons:A(v.lessons).filter(function(x){return x&&typeof x.course==="string";}),
      repeats:A(v.repeats).filter(ok),recent:A(v.recent).filter(ok),whole:true};}
  function html(){
    var cs=Object.keys(M.courses).sort(function(a,b){return M.courses[b]-M.courses[a]||(a<b?-1:1);});
    var row=function(b,s,n){return '<div class="au-row"><div class="au-who"><b>'+b+'</b><small>'+s+'</small></div>'+(n?'<span class="au-count">'+n+'</span>':'')+'</div>';};
    var filter=cs.length>1||pickC?'<p><label for="admTutorCourse">Course </label><select id="admTutorCourse" style="min-height:32px;max-width:100%;font:inherit">'+
      '<option value="">All courses ('+M.all+')</option>'+cs.map(function(c){return '<option value="'+esc(c)+'"'+(c===pickC?" selected":"")+'>'+esc(CN[c]||c)+' ('+M.courses[c]+')</option>';}).join("")+'</select></p>':'';
    var body=M.total?'<div class="adm-subs">'+
      '<div class="adm-sub"><h3>Lessons with the most questions</h3><div class="au-rows">'+M.lessons.map(function(x){return row(where(x),'last asked '+ago(x.t),x.n);}).join("")+'</div></div>'+
      '<div class="adm-sub"><h3>Asked more than once</h3><div class="au-rows">'+(M.repeats.length?M.repeats.map(function(x){return row(esc(x.q),where(x),x.n+"×");}).join(""):'<div class="au-empty info">No question has been asked twice yet.</div>')+'</div></div></div>'+
      '<div class="adm-sub"><h3>Recent questions</h3><div class="au-rows">'+M.recent.map(function(r){return row(esc(r.q),where(r)+' · <span title="'+esc(new Date(r.created_at).toLocaleString())+'">'+ago(r.created_at)+'</span>');}).join("")+'</div></div>'
      :'<div class="au-empty info">No tutor questions yet.</div>';
    return '<h2>Tutor: most-asked questions <span class="au-count">'+(pickC?M.total+" of ":"")+M.all+(!M.whole&&M.all>=MAXR?"+":"")+'</span></h2>'+
      '<p>What learners ask the AI tutor, '+(M.whole?'all of it':'newest '+MAXR)+' ('+M.week+' in the last 7 days'+(pickC?' in this course':'')+'). Only the question text, the course, the lesson and the time are stored: no name, no answer, no code; a question is deleted after 180 days. “[explain] …”, “[quiz] …” are quick actions on that section; “[runfail]” and “[review]” are the editor buttons (Java, SQL, Python). A lesson that collects many questions is a lesson to improve. '+
      '<button class="au-btn sm" type="button" id="admTutorRe">Refresh</button></p>'+filter+body;}
  function bind(s){
    s.querySelector("#admTutorRe").onclick=function(){s.remove();M=null;rows=null;get();};
    var c=s.querySelector("#admTutorCourse");
    if(c)c.onchange=async function(){pickC=c.value;c.disabled=true;if(srv)await load();else M=local();
      if(!M){c.disabled=false;return;}s.innerHTML=html();bind(s);var n=s.querySelector("#admTutorCourse");if(n)n.focus();};}
  function put(){
    if(!M||document.getElementById("adm-tutor")||!app.querySelector(".au-panel"))return;
    var s=document.createElement("section");s.className="au-panel";s.id="adm-tutor";s.innerHTML=html();app.appendChild(s);bind(s);}
  /* server numbers first; a missing function (or any error) → the newest 1,000 rows, counted here */
  async function load(){
    if(srv!==false&&typeof AUTH.sb.rpc==="function"){try{var r=await AUTH.sb.rpc("tutor_questions_stats",{p_course:pickC||null});
      if(!r.error&&r.data&&typeof r.data==="object"){srv=true;M=fromSrv(r.data);return;}}catch(e){}srv=false;}
    if(!rows){try{var q=await AUTH.sb.from("tutor_questions").select("id,created_at,course,lesson,q").order("created_at",{ascending:false}).limit(MAXR);
      rows=q.error||!Array.isArray(q.data)?false:q.data.filter(ok);}catch(e){rows=false;}}
    M=rows?local():false;}
  async function get(){
    if(busy||M!==null)return;busy=true;
    /* retention: old rows go before the list is read; once per page load, and it may fail quietly (SQL not run yet) */
    if(!pruned){pruned=true;try{if(typeof AUTH.sb.rpc==="function")await AUTH.sb.rpc("tutor_questions_prune");}catch(e){}}
    await load();busy=false;put();}
  function tick(){if(!app.querySelector(".au-panel")||document.getElementById("adm-tutor"))return;if(M===null)get();else put();}
  new MutationObserver(tick).observe(app,{childList:true});tick();
})();
</script>
<!-- ===== end AI tutor panel ===== -->
<!-- ===== Email block (to-do H item 5, phase P10; kb/lock/access-lock.md → §20) =====
     Self-contained. Shows whether application mail is set up, the newest 30 rows of public.mail_outbox (kind, person, state: no
     mail text is stored), "Send a test to me" and "Send queued now". Hidden while the SQL block has not run (the table read
     fails). The learner rows' Nudge button becomes "Send" only when the edge function `notify` answers status ok AND that
     learner turned study emails on (profiles.mail_prefs.nudge); otherwise Nudge copies the message as before.
     window.ADMMAIL = {nudge(x, button) → a message for the toast, or null = "not sent from here, copy instead"; why(x)}. -->
<script>
(function(){
  var app=document.getElementById("app");
  if(!app||!window.AUTH||!AUTH.sb||!AUTH.fn||!window.MutationObserver)return;
  var esc=AUTH.esc,ROWS=null,ST=null,WHO={},OPT={},state=0,note="";   /* state 0 = not asked, 1 = asking, 2 = shown, 3 = no table (hidden) */
  var KIND={approved:"Account approved",rejected:"Account not approved",course_approved:"Course opened",course_rejected:"Course request declined",nudge:"Nudge",weekly:"Weekly summary",owner_digest:"Owner digest"};
  var CHIP={sent:"approved",queued:"pending",sending:"pending",failed:"rejected",skipped:""};
  function ago(t){var m=Math.max(0,Math.round((Date.now()-new Date(t))/6e4));return m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago";}
  function ready(){return !!(ST&&ST.status==="ok");}
  function nm(x){return x.u.name||x.u.username||x.u.email;}
  async function rows(){
    try{var r=await AUTH.sb.from("mail_outbox").select("id,user_id,kind,status,tries,error,created_at,sent_at").order("created_at",{ascending:false}).limit(30);
      if(r.error||!Array.isArray(r.data))return false;ROWS=r.data;return true;}catch(e){return false;}}
  async function load(){
    if(!(await rows())){state=3;return;}
    try{var s=await AUTH.fn("notify",{mode:"status"});ST=s&&typeof s.configured==="boolean"?s:{gone:true};}catch(e){ST={gone:true};}
    WHO={};OPT={};
    try{var p=await AUTH.sb.from("profiles").select("id,name,username,email,mail_prefs");
      if(!p.error)(p.data||[]).forEach(function(x){WHO[x.id]=x.name||x.username||x.email||"";if(x.mail_prefs&&x.mail_prefs.nudge===true)OPT[x.id]=1;});}catch(e){}
    state=2;}
  function html(){
    var on=ready(),miss=ST&&Array.isArray(ST.missing)?ST.missing.filter(function(k){return /^[A-Z_]{3,30}$/.test(k);}):[];
    var say=on?"Mail is set up. Decisions on accounts and course requests are mailed automatically; a nudge goes out when you click Send on a learner who turned study emails on."+(ST.cron?"":" The scheduled run is not set up yet (secret CRON_KEY), so queued mail waits until you click “Send queued now”.")
      :ST&&ST.gone?"The <code>notify</code> function did not answer (not deployed yet, or your face login is over 1 hour old). Mails are only queued; a queued mail is dropped after 48 hours."
      :"Not set up yet"+(miss.length?": missing secret"+(miss.length>1?"s":"")+" "+miss.map(function(k){return "<code>"+esc(k)+"</code>";}).join(", "):"")+". Mails are only queued; a queued mail is dropped after 48 hours.";
    var n=Object.keys(OPT).length;
    return '<h2>Email <span class="au-count">'+(on?"on":"not set up")+'</span></h2><p>'+say+' '+n+' learner'+(n===1?" has":"s have")+' study emails turned on.</p>'+
      '<div class="au-acts" style="justify-content:flex-start">'+(on?'<button class="au-btn sm" type="button" data-mail="test">Send a test to me</button><button class="au-btn sm" type="button" data-mail="drain">Send queued now</button>':'')+
      '<button class="au-btn sm" type="button" data-mail="re">Refresh</button></div><p class="au-msg" role="status" id="admMailMsg">'+esc(note)+'</p>'+
      '<div class="adm-sub"><h3>Last '+ROWS.length+' mail'+(ROWS.length===1?"":"s")+'</h3><div class="au-rows">'+(ROWS.length?ROWS.map(function(r){
        var st=CHIP.hasOwnProperty(r.status)?r.status:"?";
        return '<div class="au-row"><div class="au-who"><b>'+esc(KIND.hasOwnProperty(r.kind)?KIND[r.kind]:"Mail")+' · '+esc(WHO[r.user_id]||"deleted account")+'</b><small>'+esc(ago(r.created_at))+
          (r.status==="sent"&&r.sent_at?" · sent "+esc(ago(r.sent_at)):"")+(r.tries>1?" · "+(+r.tries||0)+" tries":"")+(r.error?" · "+esc(String(r.error).slice(0,120)):"")+'</small></div><span class="au-chip" data-s="'+(CHIP[st]||"")+'">'+esc(st)+'</span></div>';}).join("")
        :'<div class="au-row"><div class="au-who"><small>Nothing has been queued yet.</small></div><span></span></div>')+'</div></div>';}
  function mark(){   /* Nudge → Send on the learners who can be mailed from here */
    var bs=app.querySelectorAll("button[data-nudge]"),on=ready();
    for(var i=0;i<bs.length;i++){var b=bs[i],want=on&&OPT[b.dataset.nudge]?"Send":"Nudge";
      if(b.textContent!==want){var al=b.getAttribute("aria-label")||"";b.textContent=want;b.title=want==="Send"?"Email a nudge (at most one per 7 days)":"";
        b.setAttribute("aria-label",want==="Send"?al.replace("Copy a nudge message for","Email a nudge to"):al.replace("Email a nudge to","Copy a nudge message for"));}}}
  function put(){
    var s=document.getElementById("adm-mail");
    if(!s){if(!app.querySelector(".au-panel"))return;s=document.createElement("section");s.className="au-panel";s.id="adm-mail";app.appendChild(s);
      s.addEventListener("click",act);}
    s.innerHTML=html();mark();}
  async function act(e){
    var b=e.target.closest("button[data-mail]");if(!b||b.disabled)return;var m=b.dataset.mail;b.disabled=true;note="";
    if(m==="test"){var r=await AUTH.fn("notify",{mode:"test"});note=r&&r.status==="ok"?"Test mail sent to your own address. Check the inbox (and the spam folder).":(r&&r.error)||"The test mail could not be sent.";}
    else if(m==="drain"){var d=await AUTH.fn("notify",{mode:"drain"});note=d&&d.status==="ok"?"Sent "+(+d.sent||0)+", failed "+(+d.failed||0)+", waiting "+((+d.retry||0)+(+d.deferred||0))+".":(d&&d.error)||"Could not send.";}
    if(m==="re")await load();else await rows();
    if(state===2)put();else{var s=document.getElementById("adm-mail");if(s)s.remove();}}
  function tick(){
    if(state===3||!app.querySelector(".au-panel"))return;
    if(state===0){state=1;load().then(function(){if(state===2)put();});return;}
    if(state===2){if(!document.getElementById("adm-mail"))put();else mark();}}
  window.ADMMAIL={
    nudge:async function(x,b){
      if(!ready()||!x||!x.u||!OPT[x.u.id])return null;
      if(b)b.disabled=true;
      var r=await AUTH.fn("notify",{mode:"nudge",user:x.u.id,idle:x.never?0:Math.max(0,Math.round(+x.idle)||0),never:!!x.never});
      if(b)b.disabled=false;
      if(r&&r.status==="ok"){await rows();if(state===2)put();return r.sent?"Nudge emailed to "+nm(x)+".":"Nudge for "+nm(x)+" is queued; it goes out with the next run.";}
      if(r&&r.status==="recent")return nm(x)+" already got a nudge in the last 7 days. Nothing was sent.";
      if(r&&r.status==="optout"){delete OPT[x.u.id];mark();}
      return null;},
    why:function(x){return !ready()?"Sending email from here is not set up yet.":x&&x.u&&OPT[x.u.id]?"It could not be emailed just now.":"They have not turned on study emails, so nothing is sent from here.";}};
  new MutationObserver(tick).observe(app,{childList:true,subtree:true});tick();
})();
</script>
<!-- ===== end Email block ===== -->
</body>
</html>
