<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/img/icon.svg" type="image/svg+xml"><meta name="theme-color" content="#4f46e5">
<title>Admin · Zero to Advanced</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@700;800&display=swap" rel="stylesheet">

</head>
<body class="au">
<div class="au-top"><a class="au-brand" href="index.html"><i><svg class="inf-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12c-2-2.6-3.6-4-5.5-4a4 4 0 0 0 0 8c1.9 0 3.5-1.4 5.5-4zm0 0c2 2.6 3.6 4 5.5 4a4 4 0 0 0 0-8c-1.9 0-3.5 1.4-5.5 4z"/></svg></i> Zero to Advanced</a><span class="au-sp"></span><a class="au-btn sm" href="index.html">All courses</a><small id="who"></small><button class="au-btn sm" type="button" id="out" hidden>Log out</button></div>
<script src="assets/js/loader.js?v=8b62be1b"></script><script>window.ZLc=window.ZL&&ZL.mount({msg:"Loading the admin panel",steps:false});</script>
<main class="au-wrap" id="app"></main>
<script src="assets/js/auth-config.js?v=e1142d0a"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/js/auth.js?v=ddb9f07c"></script>
<script>
/* admin v1: course requests, approved photos (invites), people, roles. Owner and admins only; the database checks every action again. */
(function(){
  try{var t=localStorage.getItem("js1-theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t;}catch(e){}
  var app=document.getElementById("app"),esc=AUTH.esc,C=AUTH.COURSES,ME=null,D={people:[],access:[],invites:[]};
  var SHORT={java:"Java",sql:"SQL",spring:"Spring",patterns:"Patterns",n8n:"n8n",dsa:"DSA",redis:"Redis",kafka:"Kafka",nginx:"NGINX",sysdesign:"System Design",behavioural:"Behavioural",docker:"Docker",api:"REST API",cicd:"CI/CD",os:"OS",networks:"Networks",dbms:"DBMS",lld:"LLD",resume:"Resume"};
  function zlDone(){if(window.ZLc){ZLc.leave();window.ZLc=null;}}   /* the loader leaves at the first render or card */
  function card(t,actions){zlDone();app.innerHTML='<div class="au-center" style="min-height:60vh"><div class="au-card"><span class="au-lock" aria-hidden="true">🔒</span><h1>Admin</h1><p>'+t+'</p><div class="au-acts">'+(actions||"")+'</div></div></div>';}

  async function load(){
    var p=await AUTH.sb.from("profiles").select("id,name,username,email,role,status,selfie_path,matched_invite,created_at").order("created_at",{ascending:false});
    var a=await AUTH.sb.from("course_access").select("user_id,course_id,status,requested_at");
    var i=await AUTH.sb.from("invites").select("id,email,name,attempts,used_at,created_at").order("created_at",{ascending:false});
    var err=p.error||a.error||i.error;if(err){card(esc(err.message));return;}
    /* page errors (2026-11-04): optional, the table exists only after the client_errors part of supabase/setup.sql has run */
    var pe=await AUTH.sb.from("client_errors").select("id,created_at,page,msg,src,ua").order("created_at",{ascending:false}).limit(40);
    /* selfies are private: short-lived signed links, owner/admins only */
    var paths=p.data.filter(function(u){return u.selfie_path;}).map(function(u){return u.selfie_path;}),urls={};
    if(paths.length){var sg=await AUTH.sb.storage.from("selfies").createSignedUrls(paths,3600);(sg.data||[]).forEach(function(x,k){if(x.signedUrl)urls[paths[k]]=x.signedUrl;});}
    /* learner progress + company question reports (2026-11-08): optional, they exist only after those parts of supabase/setup.sql have run */
    var po=await AUTH.sb.rpc("progress_overview");
    var qt=await AUTH.sb.from("question_tags").select("id,user_id,q_key,company,round,created_at").order("created_at",{ascending:false}).limit(60);
    /* face check mode (2026-11-09): optional, the app_settings table exists only after that part of supabase/setup.sql has run */
    var fm=await AUTH.sb.from("app_settings").select("value").eq("key","face_mode").maybeSingle();
    var pf=await AUTH.sb.from("profiles").select("id,face_mode");   /* per-person override; the column exists after the same part of setup.sql */
    if(!pf.error)pf.data.forEach(function(x){var u=p.data.find(function(y){return y.id===x.id;});if(u)u.face_mode=x.face_mode;});
    D={people:p.data,access:a.data,invites:i.data,urls:urls,errors:pe.error?null:pe.data,progress:po.error?null:po.data,tags:qt.error?null:qt.data,faceMode:fm.error||!fm.data?null:fm.data.value};render();
  }
  function person(id){return D.people.find(function(x){return x.id===id;})||{email:"?"};}
  function face(u,big){var src=u.selfie_path&&D.urls[u.selfie_path];return src?'<img class="au-face'+(big?' big':'')+'" src="'+esc(src)+'" alt="Selfie of '+esc(u.name||u.email)+'" loading="lazy">':'<span class="au-face'+(big?' big':'')+'" aria-hidden="true">'+esc((u.name||u.email||"?").charAt(0).toUpperCase())+'</span>';}
  function statusOf(uid,c){var r=D.access.find(function(x){return x.user_id===uid&&x.course_id===c;});return r?r.status:"none";}

  function render(){
    var pend=D.access.filter(function(x){return x.status==="pending";});
    var h='<h1>Admin</h1><p>Approve new accounts and course requests, give or remove courses, block or remove people, and choose admins. Owner and admins open every course.</p>';
    var fresh=D.people.filter(function(u){return u.role==="learner"&&u.status==="pending";});
    h+='<section class="au-panel"><h2>New registrations <span class="au-count">'+fresh.length+'</span></h2><p>People who registered with a selfie. Check the face and the name, then approve or reject the account.</p><div class="au-rows">';
    h+=fresh.length?fresh.map(function(u){
      return '<div class="au-row">'+face(u,true)+'<div class="au-who"><b>'+esc(u.name||"(no name)")+'</b><small>'+esc(u.email)+' · registered '+new Date(u.created_at).toLocaleString()+'</small></div>'+
        '<button class="au-btn sm ok" data-acct="approved" data-u="'+u.id+'">Approve account</button><button class="au-btn sm no" data-acct="rejected" data-u="'+u.id+'">Reject</button></div>';}).join(""):'<div class="au-empty">No one is waiting.</div>';
    h+='</div></section>';

    h+='<section class="au-panel"><h2>Course requests <span class="au-count">'+pend.length+'</span></h2><p>People asking to open a course.</p><div class="au-rows">';
    h+=pend.length?pend.map(function(r){var u=person(r.user_id);
      return '<div class="au-row"><div class="au-who"><b>'+esc(u.name||u.email)+'</b><small>'+esc(u.email)+' · wants <b>'+esc(C[r.course_id])+'</b></small></div>'+
        '<button class="au-btn sm ok" data-dec="approved" data-u="'+r.user_id+'" data-c="'+r.course_id+'">Approve</button>'+
        '<button class="au-btn sm no" data-dec="rejected" data-u="'+r.user_id+'" data-c="'+r.course_id+'">Reject</button></div>';}).join(""):'<div class="au-empty">No requests waiting.</div>';
    h+='</div></section>';

    /* People and courses comes before the pre-approve form, so on a phone the list is not buried under the form */
    var pre='<section class="au-panel"><h2>Pre-approve by photo <span class="au-count">optional</span></h2><p>Add someone you already know with a clear photo of their face. When they register with this email and their selfie matches, their account is approved automatically. The photo is turned into face numbers and not stored.</p>'+
      '<div class="au-grid2"><form class="au-form" id="inv"><label>Name<input id="ivName" required></label><label>Email<input id="ivMail" type="email" required></label>'+
      '<label>Photo<input id="ivPhoto" type="file" accept="image/*" required></label><button class="au-btn pri" type="submit">Pre-approve</button><p class="au-msg" id="ivMsg" role="status"></p></form>'+
      '<div class="au-rows">'+(D.invites.length?D.invites.map(function(v){
        var st=v.used_at?'<span class="au-chip" data-s="approved" disabled>Registered</span>':v.attempts>=5?'<span class="au-chip" data-s="rejected">Locked: 5 failed tries</span>':'<span class="au-chip" data-s="pending">Waiting to register</span>';
        return '<div class="au-row"><div class="au-who"><b>'+esc(v.name)+'</b><small>'+esc(v.email)+'</small></div>'+st+(v.used_at?'':'<button class="au-btn sm no" data-delinv="'+v.id+'">Remove</button>')+'</div>';}).join(""):'<div class="au-empty">No one approved yet.</div>')+
      '</div></div></section>';

    var owner=ME.profile.role==="owner";
    h+='<section class="au-panel"><h2>People and courses <span class="au-count">'+D.people.length+'</span></h2><p>Give or remove a course with one click: <b>✓</b> = has the course (click to remove), <b>+</b> = no access (click to give). Block stops an account without deleting it; Remove user deletes it for good.'+(owner?' Only you (the owner) can make or remove admins.':'')+'</p>'+
      '<input class="au-search" id="pplQ" type="search" placeholder="Search by name, username or email" aria-label="Search people" value="'+esc(Q)+'"><div class="au-rows" id="pplRows">';
    h+=D.people.map(function(u){
      var staff=u.role==="owner"||u.role==="admin",me=u.id===ME.user.id,id=' data-u="'+u.id+'"',chips,acct='',role='',del='';
      if(staff)chips='<span class="au-chip" data-s="approved">All courses ('+u.role+')</span>';
      else chips=Object.keys(C).map(function(c){var s=statusOf(u.id,c),on=s==="approved";
        return '<button class="au-chip" data-s="'+s+'" data-tog="'+c+'"'+id+' aria-pressed="'+on+'" title="'+(on?"Has "+C[c]+": click to remove":"Click to give "+C[c])+'">'+(on?"✓ ":"+ ")+SHORT[c]+(s==="pending"?" · asked":s==="rejected"?" · refused":"")+'</button>';}).join("")+
        '<button class="au-btn sm" data-all="approved"'+id+'>Give all</button><button class="au-btn sm" data-all="none"'+id+'>Remove all</button>';
      if(u.role==="learner")acct=u.status==="pending"?'<span class="au-chip" data-s="pending">account waiting</span><button class="au-btn sm ok" data-acct="approved"'+id+'>Approve</button><button class="au-btn sm no" data-acct="rejected"'+id+'>Reject</button>'
        :u.status==="rejected"?'<span class="au-chip" data-s="rejected">blocked</span><button class="au-btn sm ok" data-acct="approved"'+id+'>Unblock</button>'
        :'<button class="au-btn sm" data-acct="rejected"'+id+'>Block</button>';
      if(owner&&u.role!=="owner")role=u.role==="admin"?'<button class="au-btn sm" data-role="learner"'+id+'>Remove admin</button>':'<button class="au-btn sm" data-role="admin"'+id+'>Make admin</button>';
      var fsel='';   /* face check for this person: Default follows "Face check at login"; the owner never gets a face check */
      if(D.faceMode&&u.role!=="owner"&&"face_mode" in u){var fv=u.face_mode||"";
        fsel='<select class="au-btn sm" data-fmu="'+u.id+'" aria-label="Face check for '+esc(u.name||u.email)+'" title="Face check at login for this person">'+
          [["","Face: default ("+D.faceMode+")"],["live","Face: live"],["photo","Face: photo"]].map(function(o){return '<option value="'+o[0]+'"'+(o[0]===fv?' selected':'')+'>'+o[1]+'</option>';}).join("")+'</select>';}
      if(!me&&u.role!=="owner"&&(u.role==="learner"||owner))del='<button class="au-btn sm no" data-del="1"'+id+'>Remove user</button>';
      var find=[u.name,u.username,u.email].join(" ").toLowerCase();
      return '<div class="au-row au-person" data-find="'+esc(find)+'">'+face(u)+'<div class="au-who"><b>'+esc(u.name||u.email)+(me?' (you)':'')+'</b><small>'+(u.username?'@'+esc(u.username)+' · ':'')+esc(u.email)+(u.matched_invite?' · matched pre-approved photo':'')+'</small></div><span class="au-role '+u.role+'">'+u.role+'</span>'+acct+role+fsel+del+
        '<div class="au-chips au-courses">'+chips+'</div></div>';}).join("");
    if(!D.people.some(function(u){return u.role==="learner";}))
      h+='<div class="au-empty"><b>No learners yet.</b> Course buttons (+ Java, ✓ SQL…) appear on each learner row. Owner and admins always open every course, so their rows have none. Share the site link: when someone registers, they appear here.</div>';
    h+='<div class="au-empty" id="pplNone" hidden>No one matches.</div></div></section>';
    var errs='';
    if(D.errors)errs='<section class="au-panel"><h2>Page errors <span class="au-count">'+D.errors.length+'</span></h2><p>JavaScript errors that learners’ browsers hit on course pages (newest first, at most 3 per page view). Fix, publish, then clear them.</p><div class="au-rows">'+
      (D.errors.length?D.errors.map(function(x){return '<div class="au-row"><div class="au-who"><b>'+esc(x.msg)+'</b><small>'+esc(x.page)+(x.src?' · '+esc(x.src):'')+' · '+new Date(x.created_at).toLocaleString()+'</small><small>'+esc(x.ua||'')+'</small></div></div>';}).join("")+
        '<div class="au-row"><button class="au-btn sm no" data-clrerr="1">Clear all page errors</button></div>':'<div class="au-empty">No errors reported.</div>')+'</div></section>';
    var prog=D.progress?progressPanel(D.progress.filter(function(r){var u=person(r.user_id);return u.role==="learner";})):'';
    var RN={online:"Online test",phone:"Phone screen",tech:"Technical",design:"Design / machine coding",manager:"Managerial",hr:"HR"},tags='';
    if(D.tags)tags='<section class="au-panel"><h2>Company question reports <span class="au-count">'+D.tags.length+'</span></h2><p>Learners mark interview cards with “I was asked this at …”. Others see only the company, round and count, never who reported it. Remove anything that looks wrong or abusive.</p><div class="au-rows">'+
      (D.tags.length?D.tags.map(function(t){var u=person(t.user_id);return '<div class="au-row"><div class="au-who"><b>'+esc(t.company)+' · '+esc(RN[t.round]||t.round)+'</b><small>'+esc(t.q_key)+' · by '+esc(u.name||u.email)+' · '+new Date(t.created_at).toLocaleString()+'</small></div><button class="au-btn sm no" data-deltag="'+t.id+'">Remove</button></div>';}).join(""):'<div class="au-empty">No reports yet.</div>')+'</div></section>';
    var fmode='';
    if(D.faceMode){var live=D.faceMode!=="photo";
      fmode='<section class="au-panel"><h2>Face check at login <span class="au-count">'+(live?"live":"photo")+'</span></h2><p><b>Live</b>: look straight, then turn the head left and right (about 7 s, stops a printed photo). <b>Photo</b>: one straight picture (about 2 s, faster). Both check the face against the account and run the anti-spoofing model. Applies to registrations and to everyone set to “Face: default” in People and courses; pick Live or Photo there to set one person apart.</p>'+
        '<div class="au-chips"><button class="au-chip" data-s="'+(live?"approved":"none")+'" data-fmode="live" aria-pressed="'+live+'">'+(live?"✓ ":"")+'Live (head turns)</button><button class="au-chip" data-s="'+(live?"none":"approved")+'" data-fmode="photo" aria-pressed="'+!live+'">'+(live?"":"✓ ")+'Photo (one picture)</button></div></section>';}
    zlDone();app.innerHTML=h+fmode+prog+tags+pre+errs;
    document.getElementById("inv").onsubmit=invite;
    document.getElementById("pplQ").oninput=function(){Q=this.value;filter();};filter();
  }
  var Q="";
  function filter(){var q=Q.trim().toLowerCase(),n=0;
    document.querySelectorAll(".au-person").forEach(function(r){var hit=!q||r.dataset.find.indexOf(q)>=0;r.hidden=!hit;if(hit)n++;});
    document.getElementById("pplNone").hidden=n>0;}

  /* Learner progress (2026-11-08, kb/lock/access-lock.md → "Progress sync"): from public.progress_overview() (owner/admins), which
     returns each learner's synced js1-sum, js1-days, quiz-miss questions and interview-day rounds. Optional: hidden until the
     progress part of supabase/setup.sql has run. */
  var CN={java:"Java",sql:"SQL",dsa:"DSA",spring:"Spring",patterns:"Patterns",lld:"LLD",api:"REST API",sysdesign:"System Design",docker:"Docker",cicd:"CI/CD",os:"OS",networks:"Networks",dbms:"DBMS",behavioural:"Behavioural",redis:"Redis",kafka:"Kafka",nginx:"NGINX",n8n:"n8n"};
  function dstr(t){var d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function streakOf(days){var s=new Set(days||[]),n=0,t=Date.now();if(!s.has(dstr(t)))t-=864e5;while(s.has(dstr(t))){n++;t-=864e5;}return n;}
  function ago(t){var m=Math.round((Date.now()-new Date(t))/6e4);return m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago";}
  function progressPanel(rows){
    var esc=AUTH.esc,now=Date.now(),act7=0,weak={},miss={},stop={},crs={};
    var list=rows.map(function(r){var sum=r.sum||{},days=r.days||[],cs=Object.keys(sum).sort(function(a,b){return (sum[b].t||0)-(sum[a].t||0);});
      var d14=0;for(var i=0;i<14;i++)if(days.indexOf(dstr(now-i*864e5))>=0)d14++;
      var idle=(now-new Date(r.updated_at))/864e5;if(idle<=7)act7++;
      cs.forEach(function(c){var x=sum[c];crs[c]=crs[c]||{n:0,und:0,tot:0,qc:0,qa:0};var k=crs[c];k.n++;k.und+=x.und||0;k.tot+=x.total||0;k.qc+=x.qc||0;k.qa+=x.qa||0;
        (x.weak||[]).forEach(function(w){var id=c+"|"+w.n;weak[id]=weak[id]||{c:c,n:w.n,u:0,p:0};weak[id].u++;weak[id].p+=w.pct;});
        if(idle>7&&x.last&&x.last.n){var s=c+"|"+x.last.n;stop[s]=stop[s]||{c:c,n:x.last.n,u:0};stop[s].u++;}});
      for(var q in (r.misses||{})){miss[q]=miss[q]||{q:r.misses[q],u:0};miss[q].u++;}
      var id=Array.isArray(r.iday)?r.iday.slice(-5):[],ip=id.length?Math.round(id.reduce(function(a,x){return a+(x.n?100*x.pts/x.n:0);},0)/id.length):null;
      return {r:r,sum:sum,cs:cs,streak:streakOf(days),d14:d14,ip:ip,idle:idle};}).sort(function(a,b){return new Date(b.r.updated_at)-new Date(a.r.updated_at);});
    var top=function(o,f,n){return Object.keys(o).map(function(k){return o[k];}).sort(f).slice(0,n);};
    var pct=function(a,b){return b?Math.round(100*a/b):0;};
    var h='<section class="au-panel"><h2>Learner progress <span class="au-count">'+rows.length+'</span></h2><p>From each learner’s synced progress (sections marked understood, quiz answers, reviews, mock rounds). Updated whenever they study while logged in. <b>'+act7+'</b> active in the last 7 days.</p>';
    h+='<div class="au-rows">'+list.map(function(x){var r=x.r;
      return '<div class="au-row"><div class="au-who"><b>'+esc(r.name||r.username||r.email)+'</b><small>@'+esc(r.username||"")+' · synced '+ago(r.updated_at)+' · streak '+x.streak+' · '+x.d14+' of last 14 days'+(x.ip!=null?' · mock '+x.ip+'%':'')+'</small></div>'+
        '<div class="au-chips">'+(x.cs.length?x.cs.slice(0,6).map(function(c){var s=x.sum[c];return '<span class="au-chip" title="sections understood · quiz accuracy">'+esc(CN[c]||c)+' '+pct(s.und,s.total)+'% · '+pct(s.qc,s.qa)+'%</span>';}).join(""):'<span class="au-chip">no lesson opened yet</span>')+'</div></div>';}).join("")+'</div>';
    var C=Object.keys(crs).sort(function(a,b){return crs[b].n-crs[a].n;});
    if(C.length)h+='<h3>Courses</h3><div class="au-rows">'+C.map(function(c){var k=crs[c];return '<div class="au-row"><div class="au-who"><b>'+esc(CN[c]||c)+'</b><small>'+k.n+' learner'+(k.n===1?'':'s')+' · avg sections understood '+pct(k.und,k.tot)+'% · quiz accuracy '+pct(k.qc,k.qa)+'%</small></div></div>';}).join("")+'</div>';
    var S=top(stop,function(a,b){return b.u-a.u;},10);
    if(S.length)h+='<h3>Where learners stop</h3><p>Last lesson of learners who have not studied for more than 7 days.</p><div class="au-rows">'+S.map(function(s){return '<div class="au-row"><div class="au-who"><b>'+esc(s.n)+'</b><small>'+esc(CN[s.c]||s.c)+' · '+s.u+' learner'+(s.u===1?'':'s')+'</small></div></div>';}).join("")+'</div>';
    var W=top(weak,function(a,b){return b.u-a.u||a.p/a.u-b.p/b.u;},10);
    if(W.length)h+='<h3>Weakest lessons</h3><p>Lessons where learners get under 60% of the quiz right.</p><div class="au-rows">'+W.map(function(w){return '<div class="au-row"><div class="au-who"><b>'+esc(w.n)+'</b><small>'+esc(CN[w.c]||w.c)+' · '+w.u+' learner'+(w.u===1?'':'s')+' · avg '+Math.round(w.p/w.u)+'% correct</small></div></div>';}).join("")+'</div>';
    var M=top(miss,function(a,b){return b.u-a.u;},15);
    if(M.length)h+='<h3>Most-missed quiz questions</h3><div class="au-rows">'+M.map(function(m){return '<div class="au-row"><div class="au-who"><b>'+esc(String(m.q||"").replace(/<[^>]*>/g,"").slice(0,300))+'</b><small>missed by '+m.u+' learner'+(m.u===1?'':'s')+'</small></div></div>';}).join("")+'</div>';
    return h+'</section>';}
  async function call(name,args){var r=await AUTH.sb.rpc(name,args);if(r.error){alert(r.error.message);return false;}return true;}
  async function rpc(name,args){await call(name,args);await load();}
  /* giving a course to an account that is still waiting (or blocked) approves the account first, or the course would not open */
  async function give(u,courses){var p=person(u);
    if(p.role==="learner"&&p.status!=="approved"){
      if(!confirm((p.name||p.email)+"'s account is "+(p.status==="rejected"?"blocked":"not approved yet")+". Approve the account and give the course?"))return;
      if(!await call("decide_user",{p_user:u,p_status:"approved"}))return load();}
    for(var i=0;i<courses.length;i++)if(!await call("decide_access",{p_user:u,p_course:courses[i],p_status:"approved"}))break;
    await load();}
  app.addEventListener("click",async function(e){var b=e.target.closest("button");if(!b||b.disabled)return;
    var u=b.dataset.u,p=u&&person(u),who=p?(p.name||p.email):"";
    if(b.dataset.acct){if(b.dataset.acct==="rejected"&&!confirm((p.status==="approved"?"Block ":"Reject ")+who+"? They will not be able to open any course until you unblock them."))return;
      b.disabled=true;await rpc("decide_user",{p_user:u,p_status:b.dataset.acct});}
    else if(b.dataset.dec){b.disabled=true;await rpc("decide_access",{p_user:u,p_course:b.dataset.c,p_status:b.dataset.dec});}
    else if(b.dataset.tog){var c=b.dataset.tog;b.disabled=true;
      if(statusOf(u,c)!=="approved"){await give(u,[c]);return;}
      if(!confirm("Remove "+C[c]+" from "+who+"?")){b.disabled=false;return;}
      await rpc("decide_access",{p_user:u,p_course:c,p_status:"none"});}
    else if(b.dataset.all){var give1=b.dataset.all==="approved",list=Object.keys(C).filter(function(c){var s=statusOf(u,c);return give1?s!=="approved":s!=="none";});
      if(!list.length)return;
      if(!give1&&!confirm("Remove every course from "+who+"?"))return;
      b.disabled=true;
      if(give1){await give(u,list);return;}
      for(var i=0;i<list.length;i++)if(!await call("decide_access",{p_user:u,p_course:list[i],p_status:"none"}))break;
      await load();}
    else if(b.dataset.del){if(!confirm("Remove "+who+" ("+p.email+") for good?\n\nTheir account, saved face, selfie and course access are deleted. They would have to register again."))return;
      b.disabled=true;
      if(await call("remove_user",{p_user:u})&&p.selfie_path)await AUTH.sb.storage.from("selfies").remove([p.selfie_path]);   // selfie: best effort, after the account is gone
      await load();}
    else if(b.dataset.role){if(!confirm(b.dataset.role==="admin"?"Make this person an admin? Admins can approve people and courses.":"Remove admin rights?"))return;
      b.disabled=true;await rpc("set_role",{p_user:b.dataset.u,p_role:b.dataset.role});}
    else if(b.dataset.fmode){if(b.dataset.fmode===D.faceMode)return;
      if(b.dataset.fmode==="photo"&&!confirm("Switch to a single photo? Faster for everyone, but a printed photo or a screen is then stopped only by the anti-spoofing model, not by head turns."))return;
      b.disabled=true;await rpc("set_face_mode",{p_mode:b.dataset.fmode});}
    else if(b.dataset.clrerr){if(!confirm("Clear every reported page error?"))return;
      b.disabled=true;var ce=await AUTH.sb.from("client_errors").delete().gte("id",0);if(ce.error)alert(ce.error.message);await load();}
    else if(b.dataset.deltag){b.disabled=true;var dt=await AUTH.sb.from("question_tags").delete().eq("id",b.dataset.deltag);if(dt.error)alert(dt.error.message);await load();}
    else if(b.dataset.delinv){if(!confirm("Remove this approval? They will not be able to register."))return;
      b.disabled=true;var r=await AUTH.sb.from("invites").delete().eq("id",b.dataset.delinv);if(r.error)alert(r.error.message);await load();}
  });

  app.addEventListener("change",async function(e){var s=e.target.closest("select[data-fmu]");if(!s)return;
    s.disabled=true;await rpc("set_user_face_mode",{p_user:s.dataset.fmu,p_mode:s.value||null});});

  /* the photo is shrunk to 640px wide in the browser before it is sent */
  function shrink(file){return new Promise(function(ok,no){var img=new Image();img.onload=function(){
      var w=Math.min(640,img.naturalWidth),h=Math.round(w*img.naturalHeight/img.naturalWidth),c=document.createElement("canvas");
      c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(img.src);ok(c.toDataURL("image/jpeg",.9));};
    img.onerror=function(){no(new Error("That file is not a picture."));};img.src=URL.createObjectURL(file);});}
  async function invite(e){e.preventDefault();var m=document.getElementById("ivMsg"),f=document.getElementById("ivPhoto").files[0];
    var btn=e.target.querySelector("button");btn.disabled=true;m.className="au-msg";m.textContent="Reading the face… (can take up to a minute if the face server was asleep)";
    try{var image=await shrink(f);}catch(x){m.className="au-msg err";m.textContent=x.message;btn.disabled=false;return;}
    var r=await AUTH.fn("invite",{name:document.getElementById("ivName").value,email:document.getElementById("ivMail").value,image:image});
    if(!r.ok){m.className="au-msg err";m.textContent=r.error||"Failed.";btn.disabled=false;return;}
    await load();var m2=document.getElementById("ivMsg");m2.className="au-msg good";m2.textContent="Pre-approved. When they register at login.html#register with this email and their selfie matches, they are in.";}

  (async function(){
    if(!AUTH.on){card("The course lock is not set up yet (assets/js/auth-config.js).");return;}
    ME=await AUTH.me();
    if(ME&&!ME.face){await AUTH.signOut(true);ME=null;}
    if(!ME){card("Log in first (with your face).",'<a class="au-btn pri" href="login.html?next=admin.html">Log in</a>');return;}
    document.getElementById("who").textContent=ME.profile.email+" · "+ME.profile.role;
    var o=document.getElementById("out");o.hidden=false;o.onclick=async function(){await AUTH.signOut();location.href="index.html";};
    if(!ME.admin){card("This page is for the owner and admins only.",'<a class="au-btn" href="index.html">All courses</a>');return;}
    load();
  })();
})();
</script>
</body>
</html>
